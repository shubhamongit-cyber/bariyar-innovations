<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <linearGradient id="favBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B132B"/>
      <stop offset="100%" stop-color="#1C2541"/>
    </linearGradient>
    <linearGradient id="favBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1D72B8"/>
      <stop offset="100%" stop-color="#1261A0"/>
    </linearGradient>
    <linearGradient id="favOrange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FB923C"/>
      <stop offset="100%" stop-color="#EA580C"/>
    </linearGradient>
    <filter id="favShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Rounded App Icon Background -->
  <rect width="128" height="128" rx="28" fill="url(#favBg)"/>

  <!-- Centered Bariyar Innovations Hex Shield Emblem -->
  <g transform="translate(20, 15) scale(0.98)" filter="url(#favShadow)">
    <!-- Outer Blue Hexagon -->
    <path d="M45 6 L88 31 L88 79 L45 104 L2 79 L2 31 Z" fill="url(#favBlue)"/>
    
    <!-- Inner White Facet -->
    <path d="M45 6 L67 19 L67 67 L45 80 L23 67 L23 19 Z" fill="#FFFFFF"/>
    
    <!-- Top Orange Diamond Peak -->
    <path d="M23 19 L45 6 L67 19 L45 32 Z" fill="url(#favOrange)"/>
    
    <!-- Red Accent Node -->
    <circle cx="78" cy="84" r="13" fill="#EF4444"/>
    <!-- Check/Spark mark -->
    <path d="M75 84 L82 77" stroke="#FFFFFF" stroke-width="4.5" stroke-linecap="round"/>
  </g>
</svg>
